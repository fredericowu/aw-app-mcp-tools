name: Security scan

on:
  schedule:
    - cron: "4 5 * * 0"
  workflow_dispatch: {}

jobs:
  security-scan:
    uses: fredericowu/aw-shared-workflows/.github/workflows/security-scan-reusable.yml@master
    with:
      runs_on: '["self-hosted","aw-baremetal"]'
    permissions:
      actions: read
      contents: read
      security-events: write
